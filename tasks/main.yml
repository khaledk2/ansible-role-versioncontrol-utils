---
# tasks file for roles/versioncontrol-utils

- name: system packages | install epel repo
  become: true
  ansible.builtin.dnf:
    name: epel-release
    update_cache: true
    state: present

- name: system packages | basic system utils
  become: true
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items:
    - git
